# ============================================================
# Yazi 快捷键配置
# 文档: https://yazi-rs.github.io/docs/configuration/keymap/
# ============================================================

# ------------------------------------------------------------
# 文件列表界面
# ------------------------------------------------------------
[mgr]

# prepend_keymap：优先级高于默认快捷键
prepend_keymap = [
  # 快速目录跳转（g + 字母）
  { on = ["g", "h"], run = "cd ~", desc = "跳转到 Home" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "跳转到配置目录" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "跳转到下载目录" },
  { on = ["g", "w"], run = "cd ~/Workspace", desc = "跳转到工作目录" },
  { on = ["g", "p"], run = "cd ~/Projects", desc = "跳转到项目目录" },
  { on = ["g", "r"], run = "cd /", desc = "跳转到根目录" },

  # 面板切换：最大化/恢复预览面板
  { on = "T", run = "plugin toggle-pane max-preview", desc = "最大化预览面板" },

  # 全选
  { on = "<C-a>", run = "select_all", desc = "选择所有文件" },

  # 清空选择
  { on = "<C-n>", run = "select_clear", desc = "清空选择" },

  # 复制文件路径到剪贴板
  { on = "yy", run = "copy", desc = "复制文件路径" },

  # 切换 linemode
  { on = "M", run = "linemode toggle", desc = "切换行模式" },
]

# append_keymap：优先级低于默认快捷键（补充不冲突的）
append_keymap = [
]

# ------------------------------------------------------------
# 任务管理器界面
# ------------------------------------------------------------
[tasks]
prepend_keymap = [
]

# ------------------------------------------------------------
# 文件信息界面
# ------------------------------------------------------------
[spot]
prepend_keymap = [
]

# ------------------------------------------------------------
# 选择器界面
# ------------------------------------------------------------
[pick]
prepend_keymap = [
]

# ------------------------------------------------------------
# 帮助界面
# ------------------------------------------------------------
[help]
prepend_keymap = [
]

# ------------------------------------------------------------
# 浮动预览界面
# ------------------------------------------------------------
[visual]
prepend_keymap = [
]

# ------------------------------------------------------------
# 输入框界面
# ------------------------------------------------------------
[input]
prepend_keymap = [
]

# ------------------------------------------------------------
# 搜索提示界面
# ------------------------------------------------------------
[select]
prepend_keymap = [
]
