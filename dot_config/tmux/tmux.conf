# =============================================================================
#  tmux.conf — optimized for Fish shell
#  Structure: paths → env sync → core → plugins → theme → run
# =============================================================================

# ── Paths ────────────────────────────────────────────────────────────────────
tmux_dir="~/.config/tmux"
tmux_conf_dir="$tmux_dir/conf"
tmux_plugins_dir="$tmux_dir/plugins"

source "$tmux_conf_dir/keybind.conf"
# source "$tmux_conf_dir/skin.conf"   # uncomment to use custom skin instead of catppuccin

# ── Shell ────────────────────────────────────────────────────────────────────
set-option -g default-shell /opt/homebrew/bin/fish

# ── Environment Variable Sync ─────────────────────────────────────────────────
# tmux 在 server 启动时快照环境变量，之后 fish 里改了不会自动同步。
# update-environment 白名单：这些变量会在每次 attach-session 时从外部 shell 同步进来。
set -g update-environment \
  "PATH \
   MANPATH \
   INFOPATH \
   SSH_AUTH_SOCK \
   SSH_AGENT_PID \
   DISPLAY \
   WAYLAND_DISPLAY \
   XDG_SESSION_TYPE \
   DBUS_SESSION_BUS_ADDRESS \
   COLORTERM \
   TERM_PROGRAM \
   fish_user_paths"

# 注意：update-environment 只在 attach 时生效，运行中的 pane 不受影响。
# 用 prefix+e 主动把当前 fish 环境变量推入 tmux（见 keybind.conf）。

# ── Terminal & Colors ────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"    # True color (fixes Neovim colors under fish)
set -ga terminal-overrides ",*:Tc"                  # Fallback true color flag

# Extended key support (for fish + neovim key combos)
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Core Behavior ────────────────────────────────────────────────────────────
set -g escape-time 0
set -sg repeat-time 500
set -g base-index 1
set -g pane-base-index 1          # keep in sync with base-index
set -wg pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 10000        # bumped from 5000
set -g focus-events on            # lets Neovim/fish know when pane is focused

set -q -g status-utf8 on
setw -q -g utf8 on

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# Vi copy mode
setw -g mode-keys vi

# Window naming
set -wg allow-rename on
set -wg automatic-rename on

# 开启鼠标支持
set -g mouse on

# ── Plugins ──────────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$tmux_plugins_dir"

set -g @plugin 'tmux-plugins/tpm'                  # 插件管理器本身，必须放第一个
set -g @plugin 'tmux-plugins/tmux-sensible'         # 一组社区公认的合理默认配置（小修复集合）
set -g @plugin 'tmux-plugins/tmux-yank'             # 复制到系统剪贴板（而不是只在 tmux 内部缓冲区）
set -g @plugin 'tmux-plugins/tmux-open'             # 选中文本后用 o 在浏览器/程序中打开（如 URL、文件路径）
set -g @plugin 'tmux-plugins/tmux-resurrect'        # 手动保存/恢复整个 tmux 会话布局（窗口、面板、运行的程序）
set -g @plugin 'tmux-plugins/tmux-continuum'        # 在 resurrect 基础上做自动定时保存 + 重启后自动恢复，必须放在最后

# Theme
set -g @plugin 'catppuccin/tmux'                    # 状态栏主题（配色、窗口样式、信息模块布局）

# ── Plugin Options ───────────────────────────────────────────────────────────

## resurrect — 会话保存/恢复
set -g @resurrect-dir "$tmux_dir/resurrect"        # 保存文件存放目录
set -g @resurrect-save 'S'                          # prefix+S 手动保存当前会话
set -g @resurrect-restore 'R'                       # prefix+R 手动恢复上次保存的会话
set -g @resurrect-strategy-nvim 'session'           # 如果面板里跑着 nvim，优先用 Session.vim 恢复编辑状态
# 重启 tmux 后，哪些正在运行的进程需要原样恢复（而不是恢复成空 shell）
set -g @resurrect-processes 'fish ssh'

## continuum — 自动保存与开机恢复（依赖 resurrect）
set -g @continuum-restore 'on'                      # 启动 tmux 时自动恢复上次会话，无需手动按 prefix+R
set -g @continuum-boot 'on'                          # 开机/重启电脑后自动拉起 tmux server
set -g @continuum-save-interval '15'                # 每隔 15 分钟自动保存一次会话状态

## yank — 复制到系统剪贴板
set -g @yank_with_mouse on                          # 鼠标选中文字即自动复制，无需额外按键
set -g @yank_action 'copy-pipe-no-clear'            # 复制后保持在 copy mode，不自动退出（方便连续复制）

## open — 用 o 打开选中内容（URL、文件路径等）
set -g @open-S 'https://www.google.com/search?q='  # 选中文字后按 prefix+S，直接用该文字发起 Google 搜索

# ── Theme: Catppuccin (v2.x 配置方式) ────────────────────────────────────────
# v2 把状态栏配置机制重写了：不再用 @catppuccin_status_modules_right 声明模块列表，
# 而是要先手动 run catppuccin.tmux 脚本（生成 @thm_* 颜色变量），再自己拼接 status-right。
# 同时官方仓库存在已知 issue：内置的 directory/application 模块在部分版本里不会实时刷新，
# 所以这里不用内置模块，直接用 tmux 原生变量手写色块，保证一定能刷新。

set -g @catppuccin_flavor 'macchiato'   # 配色方案：latte(浅色) | frappe | macchiato | mocha(深色)
                                          # 注意变量名是 flavor（美式拼写），不是 flavour

set -g @catppuccin_window_tabs_enabled "off"   # 关闭 catppuccin 顶部窗口标签栏
## 窗口标签样式 — 关闭 catppuccin 窗口样式，用 tmux 原生格式
set -g pane-border-status off              # 关闭窗格边框标签
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_window_number_position "left"

# 当前窗口：橙色背景 + 黑色字体
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_green}] #I #W "
# 非当前窗口：灰色背景 + 黑色字体
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_peach}] #I #W "
set -g window-status-separator ""
## 全局分隔符/填充风格（仍然有效，属于 v2 通用配置项）
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

## ⚠️ 关键步骤：必须在这里先运行 catppuccin 脚本，
## 下面的 status-left / status-right 才能正确引用 @thm_* 配色变量
run "$tmux_plugins_dir/tmux/catppuccin.tmux"

## ── 手动拼接状态栏（左：会话名；右：日期时间） ──
set -g status-left-length 60
set -g status-right-length 250

set -g status-left "#[fg=#{@thm_crust},bg=#{@thm_mauve}] 󰖲 #S "

set -g status-right ""
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_green}] 󰆍 #{pane_current_command} "  # 当前运行的程序
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}] 󰉋 #{b:pane_current_path} "          # 当前目录
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_lavender}] 󰥔 %Y-%m-%d %H:%M "          # 日期时间

# ── Run Plugins ───────────────────────────────────────────────────────────────
run "$tmux_plugins_dir/tpm/tpm"
run-shell "$tmux_plugins_dir/tmux-resurrect/resurrect.tmux"
run-shell "$tmux_plugins_dir/tmux-continuum/continuum.tmux"
