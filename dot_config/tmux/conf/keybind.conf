# =============================================================================
#  keybind.conf — all key bindings in one place
#  sourced by tmux.conf
# =============================================================================

# ── Sessions ──────────────────────────────────────────────────────────────────
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind C-n new-session

# ── Pane Navigation (vim-aware via is_vim detection) ─────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n 'C-j' if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n 'C-k' if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n 'C-l' if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Also keep prefix+hjkl as fallback
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── Pane Resize ───────────────────────────────────────────────────────────────
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5
bind -r _ resize-pane -D 5
bind -r + resize-pane -U 5

# ── Splits & Windows ──────────────────────────────────────────────────────────
# Inherit current path — critical for fish users
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Move windows left/right
bind-key -n C-S-Left  swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Kill without confirmation prompt
bind x kill-pane
bind X kill-window

# Sync panes toggle (run same command in all panes)
bind * setw synchronize-panes \; display "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# ── Copy Mode (vi) ────────────────────────────────────────────────────────────
bind Escape copy-mode
bind C-p pasteb

bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi H   send-keys -X start-of-line
bind-key -T copy-mode-vi L   send-keys -X end-of-line

# ── Misc ──────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded!"

# Pass Shift-Enter correctly to Neovim/fish
bind -n S-Enter send-keys Escape "[13;2u"

# prefix+e → 主动将当前 fish 环境变量同步进 tmux
# 适用场景：fish 里 set -gx 新变量、direnv 切了项目、手动改了 API key 等
# 原理：起一个 fish 子进程读 env，逐条 tmux setenv -g 写入 server 全局环境表
bind e run-shell \
  'fish -c "for line in (env); \
     set kv (string split -m1 = \$line); \
     tmux setenv -g \$kv[1] \$kv[2] 2>/dev/null; \
   end"; \
   tmux display "󰁆  env synced from fish"'
