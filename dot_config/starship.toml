# ============================================================
# Starship 配置 - Catppuccin Mocha 配色（非分块风格）
# 内容模块：目录 / git分支+状态 / 语言版本 / Docker / 时间
# ============================================================

command_timeout = 1000

# 格式顺序：
# 目录 → git分支+状态 → 语言版本 → Docker → 运行时间 → 时间 → 提示符
format = """
$directory$git_branch$git_status$c$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context$cmd_duration$time$line_break$character"""

# ------------------------------------------------------------
# 目录
# ------------------------------------------------------------
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #89b4fa"
read_only_style = "#f38ba8"

# ------------------------------------------------------------
# Git 分支
# ------------------------------------------------------------
[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "#cba6f7"

# ------------------------------------------------------------
# Git 状态（精简模式：只显示符号，不显示详细数字）
# ------------------------------------------------------------
[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "#f9e2af"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${count}"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "→"
deleted = "x"

# ------------------------------------------------------------
# 语言版本（有对应文件才显示）
# ------------------------------------------------------------
[c]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#89dceb"

[rust]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#fab387"

[golang]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#89b4fa"

[nodejs]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#a6e3a1"

[php]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#89dceb"

[java]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#f9e2af"

[kotlin]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#cba6f7"

[haskell]
symbol = " "
format = "via [$symbol$version]($style) "
style = "#cba6f7"

[python]
python_binary = "python3"
symbol = " "
format = "via [$symbol$virtualenv$version]($style) "
style = "#f9e2af"

# ------------------------------------------------------------
# Docker context
# ------------------------------------------------------------
[docker_context]
symbol = " "
format = "on [$symbol$context]($style) "
style = "#89b4fa"

# ------------------------------------------------------------
# 时间
# ------------------------------------------------------------
[time]
disabled = false
time_format = "%R"
format = "at [$time]($style) "
style = "#6c7086"

# ------------------------------------------------------------
# 命令执行时间（超时才显示）
# ------------------------------------------------------------
[cmd_duration]
min_time_to_notify = 2000
format = "took [$duration]($style) "
style = "#f9e2af"

# ------------------------------------------------------------
# 提示符
# ------------------------------------------------------------
[character]
disabled = false
success_symbol = "[](bold #a6e3a1)"
error_symbol = "[](bold #f38ba8)"
vimcmd_symbol = "[](bold #a6e3a1)"
vimcmd_replace_one_symbol = "[](bold #cba6f7)"
vimcmd_replace_symbol = "[](bold #cba6f7)"
vimcmd_visual_symbol = "[](bold #f9e2af)"
