# ============================================================
# Starship 配置 - Catppuccin Mocha
# ============================================================

command_timeout = 1000

# 格式顺序：
# 目录 → git分支+状态 → 包版本 → 语言版本 → 执行时间 → 提示符
format = """
$directory$git_branch$git_status$package$python$nodejs$rust$golang$cmd_duration$line_break$character"""

# ------------------------------------------------------------
# 目录
# ------------------------------------------------------------
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #89b4fa"
read_only_style = "#f38ba8"

# ------------------------------------------------------------
# Git 分支
# ------------------------------------------------------------
[git_branch]
format = "on [$symbol$branch]($style) "
style = "#cba6f7"
symbol = ""

# ------------------------------------------------------------
# Git 状态（精简模式：只显示符号，不显示详细数字）
# ------------------------------------------------------------
[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "#f9e2af"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${count}"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "→"
deleted = "x"

# ------------------------------------------------------------
# 包版本（npm/cargo/pnpm 等）
# ------------------------------------------------------------
[package]
format = "is [📦 $version]($style) "
style = "#fab387"

# ------------------------------------------------------------
# 语言版本
# ------------------------------------------------------------
[python]
python_binary = "python3"
format = "via [🐍 $virtualenv$version]($style) "
style = "#f9e2af"
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", "*.py"]

[nodejs]
format = "via [⚡ $version]($style) "
style = "#a6e3a1"
detect_files = ["package.json", ".nvmrc"]

[rust]
format = "via [🦀 $version]($style) "
style = "#fab387"
detect_files = ["Cargo.toml"]

[golang]
format = "via [🐹 $version]($style) "
style = "#89dceb"
detect_files = ["go.mod", "main.go"]

# ------------------------------------------------------------
# 命令执行时间
# ------------------------------------------------------------
[cmd_duration]
min_time_to_notify = 2000
format = "took [$duration]($style) "
style = "#f9e2af"

# ------------------------------------------------------------
# 提示符
# ------------------------------------------------------------
[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
